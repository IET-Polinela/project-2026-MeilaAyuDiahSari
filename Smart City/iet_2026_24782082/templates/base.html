<!DOCTYPE html>
<html>
<head>
    <title>Smart City Lampung Selatan</title>

    <!-- RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* =========================
           GLOBAL
        ========================= */
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background-color:#ffe4e9;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        h1, h2{
            color:#a64254;
        }

        p{
            font-size:18px;
            color:#444;
            line-height:1.6;
        }

        /* =========================
           NAVBAR
        ========================= */
        .navbar{
            background-color:#a64254 !important;
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
        }

        .navbar-nav .nav-link{
            color:white !important;
            font-weight:bold;
        }

        .navbar-nav .nav-link:hover{
            color:#ffc2cc !important;
        }

        /* =========================
           LAYOUT
        ========================= */
        .container{
            padding:40px 20px;
            flex:1;
        }

        .card-custom{
            background:white;
            border-radius:15px;
            box-shadow:0 5px 15px rgb(182, 77, 119);
            padding:30px;
        }

        footer{
            margin-top:50px;
            background:#ffc2cc;
            text-align:center;
            padding:15px;
            color:#7a2e3a;
        }

        /* =========================
           TABLE (PINK THEME)
        ========================= */
        .table{
            border-radius:10px;
            overflow:hidden;
        }

        .table thead{
            background-color:#a64254 !important;
            color:white;
        }

        .table-header-custom {
            background-color: #a64254;
            color: white;
        }

        .table-striped tbody tr:nth-of-type(odd){
            background-color:#ffe4e9;
        }

        .table-bordered{
            border-color:#ffc2cc;
        }

        .table tbody tr:hover{
            background-color:#ffd6dd;
            transition:0.3s;
        }

        /* =========================
           BADGE
        ========================= */
        .badge{
            border-radius:6px;
            font-weight:500;
        }

        /* =========================
           BUTTON
        ========================= */
        .btn{
            border-radius:8px;
            font-weight:500;
        }

        .btn:hover{
            opacity:0.9;
            transition:0.2s;
        }

        .btn-custom {
            background-color: #a64254;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #8e3948;
            color: white;
        }

        /* =========================
           BREADCRUMB
        ========================= */
        .breadcrumb a {
            color: #a64254;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE TEXT */
        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
            }
            h2 {
                font-size: 20px;
            }
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Smart City</a>

        <!-- (HAMBURGER MENU) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- RESPONSIVE -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about/meila/">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/contacts/">Contacts</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/reports/">Reports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/add/">Tambah Laporan</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container">

    <!-- ALERT MESSAGE -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer>
    © 2026 Smart City Lampung Selatan
</footer>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- LOADING FEEDBACK -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const forms = document.querySelectorAll("form");

    forms.forEach(form => {
        form.addEventListener("submit", function () {
            const button = form.querySelector("button[type='submit']");
            
            if (button) {
                button.disabled = true;
                button.innerHTML = `
                    <span class="spinner-border spinner-border-sm"></span>
                    Loading...
                `;
            }
        });
    });
});
</script>

</body>
</html>
