<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Warga - Smart City Lampung Selatan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffe4e9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: #a64254 !important;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .navbar-nav .nav-link {
            color: white !important;
            font-weight: bold;
        }

        .navbar-nav .nav-link:hover {
            color: #ffc2cc !important;
        }

        .spa-container {
            flex: 1;
            padding-top: 20px;
        }

        .page-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(182, 77, 119, 0.15);
            padding: 30px;
            min-height: calc(100vh - 180px);
        }

        footer {
            background: #ffc2cc;
            text-align: center;
            padding: 14px 0;
            color: #7a2e3a;
            font-size: 0.95rem;
        }
        /* BUTTON STYLES - match main project theme */
        .btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 10px 18px;
        }

        .btn-primary {
            background-color: #a64254; /* theme pink */
            border-color: #a64254;
            color: #fff;
            box-shadow: 0 10px 30px rgba(166, 66, 84, 0.12);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1rem;
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #842b45;
            border-color: #842b45;
            color: #fff;
        }

        /* A slightly larger CTA used in SPA pages */
        .btn-cta {
            padding: 12px 22px;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container px-4">
            <a class="navbar-brand" href="#">
                <i class="bi bi-buildings-fill me-2"></i>
                Smart City Lampung Selatan
            </a>

            <div id="nav-menu" class="ms-auto"></div>
        </div>
    </nav>

    <main class="container spa-container" id="app-content">
        <div class="page-card" id="page-card">
            <!-- Konten aplikasi akan dimuat di sini -->
        </div>
    </main>

    <footer>
        © 2026 Smart City Lampung Selatan. Semua hak dilindungi.
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>
</body>
</html>
